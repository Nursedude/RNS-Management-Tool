name: Lint and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check (rns_management_tool.sh)
        run: bash -n rns_management_tool.sh

      - name: Bash syntax check (lib/ modules)
        run: |
          for module in lib/*.sh; do
            echo "Checking $module..."
            bash -n "$module"
          done

      - name: ShellCheck rns_management_tool.sh
        run: shellcheck -x -S warning rns_management_tool.sh

      - name: ShellCheck lib/ modules
        run: |
          for module in lib/*.sh; do
            echo "Checking $module..."
            shellcheck -x -S warning "$module"
          done

  custom-lint:
    name: Custom Linter (RNS001-RNS010)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Run project-specific linter
        run: bash scripts/lint.sh

  check-mode:
    name: Dry-Run Check Mode
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Run --check mode
        run: bash rns_management_tool.sh --check

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Make smoke test executable
        run: chmod +x tests/smoke_test.sh

      - name: Run smoke tests
        run: ./tests/smoke_test.sh --verbose

  bats:
    name: Bats Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # for the PR-comment failure diagnostic below
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Run bats test suite
        id: bats
        shell: bash
        run: |
          set -o pipefail
          {
            bats tests/rns_management_tool.bats &&
            bats tests/hardware_validation.bats &&
            bats tests/integration_tests.bats &&
            bats tests/regression_guards.bats &&
            bats tests/functional_tests.bats &&
            bats tests/service_health_tests.bats &&
            bats tests/diagnostics_enhanced.bats
          } 2>&1 | tee /tmp/bats.log

      - name: Dump failure summary
        if: failure() && steps.bats.outcome == 'failure'
        shell: bash
        run: |
          echo "============================================"
          echo "== BATS FAILURE SUMMARY (CI-EXTRACTED)   =="
          echo "============================================"
          # Extract each failing test plus its attached diagnostic `#` lines.
          # TAP format: `not ok N - desc` starts a failure block; subsequent
          # `# ...` lines are the diagnostic for that failure until the next
          # `ok N` / `not ok N` line.
          awk '
            /^not ok / { printing=1; print; next }
            /^ok /     { printing=0; next }
            printing   { print }
          ' /tmp/bats.log | head -100 || true
          echo "--- failing test names ---"
          grep -aE "^not ok " /tmp/bats.log | head -50 || true
          echo "============================================"

      - name: Post failure summary to PR
        if: failure() && steps.bats.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "DEBUG: entering comment step for PR #${PR_NUMBER}"
          echo "DEBUG: /tmp/bats.log size: $(wc -c </tmp/bats.log 2>/dev/null || echo MISSING)"
          # Use tilde code fence and strip any leading ~~~ in test output so a
          # malicious test name/diagnostic cannot close the fence and inject
          # arbitrary markdown into the PR comment body.
          {
            echo "## BATS test failure summary"
            echo ""
            echo '~~~'
            awk '
              /^not ok / { printing=1; print; next }
              /^ok /     { printing=0; next }
              printing   { print }
            ' /tmp/bats.log \
              | head -100 \
              | sed 's/^~~~/~ ~~/' || true
            echo '~~~'
          } > /tmp/bats-comment.md
          echo "DEBUG: comment body:"
          cat /tmp/bats-comment.md
          echo "DEBUG: posting comment…"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/bats-comment.md
          echo "DEBUG: gh pr comment exit=$?"

  powershell:
    name: PowerShell Syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse main script (syntax check)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/rns_management_tool.ps1",
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell main script syntax check passed"

      - name: Parse pwsh/ modules (syntax check)
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path pwsh/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "FAIL: $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Error $_.Message }
              $allErrors += $errors
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($allErrors.Count -gt 0) { exit 1 }
          Write-Host "All PowerShell modules passed syntax check"

      - name: PSScriptAnalyzer lint
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path rns_management_tool.ps1 -Settings .PSScriptAnalyzerSettings.psd1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            $errorCount = ($results | Where-Object Severity -eq 'Error').Count
            if ($errorCount -gt 0) {
              Write-Error "$errorCount error(s) found by PSScriptAnalyzer"
              exit 1
            }
            Write-Warning "$($results.Count) warning(s) found by PSScriptAnalyzer"
          } else {
            Write-Host "PSScriptAnalyzer: no issues found"
          }

  pester:
    name: Pester Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/*.tests.ps1"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "tests/pester-results.xml"
          Invoke-Pester -Configuration $config
